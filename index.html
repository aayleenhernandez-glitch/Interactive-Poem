<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>The Golden Cage | Interactive Poem</title>
	<link rel="stylesheet" href="./assets/css/styles.css">
</head>
<body>
	<main class="scene">
		<div class="stars"></div>
		<div class="gold grid"></div>
		<div class="glow"></div>

		<section class="poem">
			
			<p class="line line-one">
			  We were made of <em>dust</em>
			</p>

			<p class="line line-two">
			  Build our cages out of og of of<span>gold</span>
			</p>

			<p class="line line-three">
			  Still we dream of <em class="flight">flight</em>
			</p>

			<div class="sparkles">✧ ✦ ✧</div>
		</section>

		<footer> THE GOLDEN CAGE | INTERACTIVE POEM </footer>
	</main>

</body>
</html>
